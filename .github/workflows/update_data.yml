name: Update NHL Data

on:
  schedule:
    # Note: GitHub Actions uses UTC time.
    # CT is UTC-6 (Standard) or UTC-5 (DST). Assuming UTC-6 (Winter).
    
    # --- PEAK DAYS (Tue, Thu, Sat) ---
    # Days: 2, 4, 6
    
    # 1. 06:30 - 09:30 AM CT (12:30 - 15:30 UTC): Hourly at min 0
    - cron: '0 12-15 * * 2,4,6'
    
    # 2. 09:30 - 12:00 PM CT (15:30 - 18:00 UTC): Hourly at min 0
    - cron: '0 15-17 * * 2,4,6'
    
    # 3. 12:00 - 07:00 PM CT (18:00 - 01:00 UTC): Hourly at min 0
    - cron: '0 18-23 * * 2,4,6'
    - cron: '0 0 * * 2,4,6'

    # 4. 07:00 - 09:00 PM CT (01:00 - 03:00 UTC): Hourly at min 0
    - cron: '0 1-2 * * 2,4,6'

    # --- NON-PEAK DAYS (Sun, Mon, Wed, Fri) ---
    # Days: 0, 1, 3, 5
    # Run hourly all day (06:30 AM - 09:00 PM CT) -> (12:30 - 03:00 UTC)
    - cron: '0 12-23 * * 0,1,3,5'
    - cron: '0 0-2 * * 0,1,3,5'

  workflow_dispatch: # Allow manual trigger

# Prevent concurrent runs from racing on the git push step.
# If a run is already in-progress, queue new runs rather than cancelling them.
concurrency:
  group: update-nhl-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Data Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          cd pipeline
          # Run full refresh in the morning (roughly between 12:00 and 14:00 UTC)
          # Otherwise run a lite refresh
          HOUR=$(date +%H)
          if [ "$HOUR" -ge 12 ] && [ "$HOUR" -le 14 ]; then
            echo "Running Full Refresh Pipeline..."
            python refresh_pipeline.py
            python snapshot_predictions.py
            python season_simulator.py
            # Fetch shift chart data for any new games (incremental — skips already-fetched)
            python fetch_shifts.py
            # Enrich PBP with on-ice player IDs (incremental)
            python enrich_pbp.py
            # Append yesterday's raw PBP events (incremental — skips already-fetched game IDs)
            python update_raw_pbp.py
          else
            echo "Running Lite Update..."
            python fetch_upcoming.py

            # Backfill player boxscore stats for any new games since last run
            # Incremental: skips game_ids already in the CSV, so fast when no new games
            python backfill_player_stats.py

            # Fetch latest odds and sync (Fix for missing odds.json in Lite Update)
            python fetch_odds.py
            cp odds.json ../data/odds.json || echo "No odds.json to copy to data/"
            cp odds.json ../public/data/odds.json || echo "No odds.json to copy to public/"

            python predict_games.py
            python snapshot_predictions.py
            # Regenerate implications so they stay current as the day rolls over
            python -c "import game_implications; game_implications.compute_game_implications()"
            # Update playoff series results and series odds after each game
            python update_playoff_series.py
            # Keep goalie career playoff stats current during postseason
            python fetch_goalie_playoff_career_stats.py
            # season_simulator.py runs in Full Refresh only — playoff odds don't need hourly precision
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if there are changes to the CSVs
          if [ -n "$(git status --porcelain)" ]; then
            git add requirements.txt || true
            [ -f data/predictions_detailed.csv ] && git add data/predictions_detailed.csv
            [ -f data/prediction_history.json ] && git add data/prediction_history.json
            [ -f data/gamestats.csv ] && git add data/gamestats.csv
            [ -f data/odds.json ] && git add data/odds.json
            [ -f public/data/odds.json ] && git add public/data/odds.json
            [ -f public/data/gamestats.csv ] && git add public/data/gamestats.csv
            [ -f public/data/predictions_detailed.csv ] && git add public/data/predictions_detailed.csv
            [ -f pipeline/upcoming_games.json ] && git add pipeline/upcoming_games.json
            [ -f pipeline/dailyfaceoff_goalies.json ] && git add pipeline/dailyfaceoff_goalies.json
            [ -f pipeline/player_news.json ] && git add pipeline/player_news.json
            [ -f pipeline/team_lineups.json ] && git add pipeline/team_lineups.json
            [ -f pipeline/nhl_season_2025_2026_gamestats.csv ] && git add pipeline/nhl_season_2025_2026_gamestats.csv
            [ -f pipeline/nhl_season_2025_2026_shots.csv ] && git add pipeline/nhl_season_2025_2026_shots.csv
            [ -f pipeline/nhl_season_2025_2026_shifts.csv ] && git add pipeline/nhl_season_2025_2026_shifts.csv
            [ -f pipeline/nhl_season_2025_2026_pbp.csv ] && git add pipeline/nhl_season_2025_2026_pbp.csv || true
            [ -f data/historical_pbp/raw_pbp_20252026.csv ] && git add data/historical_pbp/raw_pbp_20252026.csv || true
            [ -f data/last_updated.json ] && git add data/last_updated.json
            # Player-impact outputs (committed so lite runs can load them)
            [ -f pipeline/player_impact.json ] && git add pipeline/player_impact.json
            [ -f pipeline/league_avg_impact.json ] && git add pipeline/league_avg_impact.json
            [ -f pipeline/player_name_lookup.json ] && git add pipeline/player_name_lookup.json
            [ -f public/data/player_impact.json ] && git add public/data/player_impact.json
            [ -f public/data/league_avg_impact.json ] && git add public/data/league_avg_impact.json
            # Player boxscore stats (availability strip + counting stats in SkaterGrid)
            [ -f public/data/nhl_season_2025_2026_player_stats.csv ] && git add public/data/nhl_season_2025_2026_player_stats.csv
            # Player bio data (age, height, weight, shoots)
            [ -f public/data/player_bio.json ] && git add public/data/player_bio.json
            # Contract data (cap hit, UFA/RFA status) from PuckPedia
            [ -f public/data/contracts.json ] && git add public/data/contracts.json
            # Team lineups (for IMP distribution against real current pairings)
            [ -f public/data/team_lineups.json ] && git add public/data/team_lineups.json
            # Prediction history snapshots
            git add public/data/SiteHistory/*.csv 2>/dev/null || true
            # Season simulation projections
            [ -f pipeline/data/season_projections.json ] && git add pipeline/data/season_projections.json
            [ -f public/data/season_projections.json ] && git add public/data/season_projections.json
            # Playoff implications (must be committed so Vercel serves today's games)
            [ -f pipeline/game_implications.json ] && git add pipeline/game_implications.json
            [ -f public/data/game_implications.json ] && git add public/data/game_implications.json
            # Clinch/elimination status (fetched in full refresh via fetch_clinch_status.py)
            [ -f public/data/clinch_status.json ] && git add public/data/clinch_status.json
            # Team and goalie ratings (written by team_ratings.py in full refresh)
            [ -f public/data/team_ratings.json ] && git add public/data/team_ratings.json
            [ -f public/data/goalie_ratings.json ] && git add public/data/goalie_ratings.json
            # Goalie season stats (W-L-OT, SV%, GAA) used on playoffs and matchup cards
            [ -f pipeline/nhl_goalie_stats.json ] && git add pipeline/nhl_goalie_stats.json
            # Goalie career playoff stats (W-L, SV%, GAA all-time postseason)
            [ -f public/data/goalie_playoff_career_stats.json ] && git add public/data/goalie_playoff_career_stats.json
            [ -f pipeline/goalie_playoff_career_stats.json ] && git add pipeline/goalie_playoff_career_stats.json
            # Last-updated timestamp shown on site
            [ -f public/data/last_updated.json ] && git add public/data/last_updated.json
            # Playoff series results and odds (written by update_playoff_series.py)
            [ -f public/data/playoff_series.json ] && git add public/data/playoff_series.json
            # Upcoming games and player news (written by fetch_upcoming.py)
            [ -f public/data/upcoming_games.json ] && git add public/data/upcoming_games.json
            [ -f public/data/player_news.json ] && git add public/data/player_news.json
            [ -f public/data/playoff_player_news.json ] && git add public/data/playoff_player_news.json
            [ -f public/data/team_goalies.json ] && git add public/data/team_goalies.json

            # Commit if changes exist
            git commit -m "Auto-Update: Data Refresh [$(date)]" || echo "No changes to commit"

            # Rebase onto latest remote state, then push
            # --autostash handles any files the pipeline modified but didn't explicitly git add
            git pull --rebase --autostash origin main
            git push

            # Trigger Vercel rebuild to serve updated data
            if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
              echo "Triggering Vercel rebuild..."
              curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            else
              echo "No Vercel deploy hook found in secrets."
            fi
          else
            echo "No changes detected."
          fi
