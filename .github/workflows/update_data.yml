name: Update NHL Data

on:
  schedule:
    # Note: GitHub Actions uses UTC time.
    # CT is UTC-6 (Standard) or UTC-5 (DST). Assuming UTC-6 (Winter).
    
    # 1. 06:30 AM - 09:30 AM CT (12:30 - 15:30 UTC): Every 20 mins
    # Covers morning updates
    - cron: '*/20 12-15 * * *'
    
    # 2. 09:30 AM - 12:00 PM CT (15:30 - 18:00 UTC): Every 15 mins
    # Covers late morning / goalie start confirmations (Peak)
    - cron: '*/15 15-17 * * *'
    
    # 3. 12:00 PM - 09:30 PM CT (18:00 - 03:30 UTC): Every 20 mins
    # Covers afternoon and live evening games
    - cron: '*/20 18-23 * * *'
    - cron: '*/20 0-3 * * *'

  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Data Pipeline
        run: |
          cd pipeline
          python fetch_upcoming.py
          python predict_games.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if there are changes to the CSVs
          if [ -n "$(git status --porcelain)" ]; then
            git add requirements.txt
            git add data/predictions_detailed.csv
            git add pipeline/upcoming_games.json
            git add pipeline/dailyfaceoff_goalies.json
            git add pipeline/player_news.json
            git add pipeline/team_lineups.json
            git add data/last_updated.json
            
            # Commit if changes exist
            git commit -m "Auto-Update: Data Refresh [$(date)]" || echo "No changes to commit"
            
            # Push changes
            git push
          else
            echo "No changes detected."
          fi
