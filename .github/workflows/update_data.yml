name: Update NHL Data

on:
  schedule:
    # Note: GitHub Actions uses UTC time.
    # CT is UTC-6 (Standard) or UTC-5 (DST). Assuming UTC-6 (Winter).
    
    # --- PEAK DAYS (Tue, Thu, Sat) ---
    # Days: 2, 4, 6
    
    # 1. 06:30 - 09:30 AM CT (12:30 - 15:30 UTC): Every 20 mins
    - cron: '*/20 12-15 * * 2,4,6'
    
    # 2. 09:30 - 12:00 PM CT (15:30 - 18:00 UTC): Every 15 mins
    - cron: '*/15 15-17 * * 2,4,6'
    
    # 3. 12:00 - 07:00 PM CT (18:00 - 01:00 UTC): Every 20 mins
    - cron: '*/20 18-23 * * 2,4,6'
    - cron: '*/20 0 * * 2,4,6'

    # 4. 07:00 - 09:00 PM CT (01:00 - 03:00 UTC): Every 30 mins
    - cron: '*/30 1-2 * * 2,4,6'

    # --- NON-PEAK DAYS (Sun, Mon, Wed, Fri) ---
    # Days: 0, 1, 3, 5
    # Run every 30 minutes all day (06:30 AM - 09:00 PM CT) -> (12:30 - 03:00 UTC)
    - cron: '*/30 12-23 * * 0,1,3,5'
    - cron: '*/30 0-2 * * 0,1,3,5'

  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Data Pipeline
        run: |
          cd pipeline
          python fetch_upcoming.py
          python predict_games.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if there are changes to the CSVs
          if [ -n "$(git status --porcelain)" ]; then
            git add requirements.txt
            git add data/predictions_detailed.csv
            git add pipeline/upcoming_games.json
            git add pipeline/dailyfaceoff_goalies.json
            git add pipeline/player_news.json
            git add pipeline/team_lineups.json
            git add data/last_updated.json
            
            # Commit if changes exist
            git commit -m "Auto-Update: Data Refresh [$(date)]" || echo "No changes to commit"
            
            # Discard any leftover changes (logs, uncommitted files) to ensure clean rebase
            git reset --hard HEAD
            
            # Pull latest changes (rebase) to avoid conflicts if we pushed UI updates meanwhile
            git pull --rebase origin main
            
            # Push changes
            git push
          else
            echo "No changes detected."
          fi
