name: Update NHL Data

# One job per hour during the NHL day.  pipeline/refresh_pipeline.py --mode auto
# picks the mode: a full ingest once per morning (12:00-14:59 UTC, retried on the
# next hour of that window if it fails, and as a catch-up after 36 h without a
# successful full run), otherwise the pregame "lite" refresh.  The pipeline
# records every stage in public/data/manifest.json and exits non-zero when a
# required stage fails; validate_outputs.py then gates the commit.

on:
  schedule:
    # 12:00-23:00 and 00:00-03:00 UTC (7 am - 11 pm ET), every day of the week.
    - cron: '0 12-23 * * *'
    - cron: '0 0-3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode (auto = full in the morning window, lite otherwise)'
        type: choice
        options: [auto, lite, full]
        default: auto

# Queue rather than cancel so two runs never race on the push.
concurrency:
  group: update-nhl-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Backstop; the pipeline step itself is limited to 20 min (lite) / 30 min (full).
    timeout-minutes: 40
    permissions:
      contents: write   # push the data commit
      issues: write     # open/update the "Data pipeline failing" issue
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # the token is handed only to the push step

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Pick mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ] && [ "$INPUT_MODE" != "auto" ]; then
            mode="$INPUT_MODE"
          else
            mode=$(python pipeline/refresh_pipeline.py --mode auto --print-mode)
          fi
          case "$mode" in full|lite) ;; *) echo "bad mode '$mode'"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Pipeline mode: $mode"

      - name: Run data pipeline
        timeout-minutes: ${{ steps.mode.outputs.mode == 'full' && 30 || 20 }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          # Rollback switches (repository variables; empty = default):
          #   PONYXG_XG=v1|shadow  publish xG v1 again (pipeline/bu/xg/README.md "Rollback")
          #   PONYXG_BU=off        publish the F1 rollback model (no RAPM lineup term); the joint
          #                        model stays logged in bu_shadow_home_win_pct (pipeline/bu/README.md)
          PONYXG_XG: ${{ vars.PONYXG_XG }}
          PONYXG_BU: ${{ vars.PONYXG_BU }}
        run: python pipeline/refresh_pipeline.py --mode "$MODE"

      - name: Validate outputs (data contract gate)
        env:
          # Comma-separated validate_outputs.py checks to downgrade to warnings
          # (repository variable), e.g. while a known upstream fix is pending.
          PONYXG_VALIDATE_ALLOW: ${{ vars.VALIDATE_ALLOW }}
        run: python pipeline/validate_outputs.py

      - name: Commit and push data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          add() { for f in "$@"; do [ -e "$f" ] && git add -- "$f"; done; return 0; }
          # Predictions, history and freshness
          add data/predictions_detailed.csv public/data/predictions_detailed.csv \
              data/prediction_history.json data/prediction_history_meta.json \
              data/last_updated.json public/data/last_updated.json \
              public/data/manifest.json public/data/SiteHistory/*.csv
          # Graded record derived from the history: report card and bet ledger
          add public/data/model_report.json public/data/bet_ledger.json
          # Schedule, goalies, lineups, injuries, news
          add pipeline/upcoming_games.json public/data/upcoming_games.json \
              pipeline/dailyfaceoff_goalies.json public/data/dailyfaceoff_goalies.json \
              public/data/team_goalies.json public/data/injuries.json \
              pipeline/team_lineups.json public/data/team_lineups.json \
              pipeline/player_news.json public/data/player_news.json public/data/playoff_player_news.json
          # Odds (pregame lines + frozen closing lines)
          add data/odds.json public/data/odds.json pipeline/odds.json public/data/odds_closing.json
          # Season game data (current season file names come from pipeline/season.py)
          add pipeline/nhl_season_*_gamestats.csv pipeline/nhl_season_*_shots.csv pipeline/nhl_season_*_shifts.csv \
              pipeline/pending_failed.json data/gamestats.csv public/data/gamestats.csv \
              public/data/nhl_season_*_player_stats.csv
          # Boxscore dressed lineups (fast-track lineup feature state; gap-driven top-up)
          add pipeline/models/fasttrack/lineups_*.csv.gz
          # Ratings and team splits
          add public/data/team_ratings.json public/data/goalie_ratings.json public/data/team_stats_extended.json \
              pipeline/nhl_goalie_stats.json
          # Player models, bios, contracts
          add pipeline/player_impact.json public/data/player_impact.json \
              pipeline/league_avg_impact.json public/data/league_avg_impact.json \
              pipeline/player_name_lookup.json pipeline/team_lineup_baselines.json public/data/team_lineup_baselines.json \
              public/data/player_bio.json public/data/contracts.json public/data/player_ratings.json
          # Season context
          add pipeline/data/season_projections.json public/data/season_projections.json \
              pipeline/game_implications.json public/data/game_implications.json \
              public/data/clinch_status.json public/data/playoff_series.json \
              pipeline/goalie_playoff_career_stats.json public/data/goalie_playoff_career_stats.json \
              public/data/season_projections_history.json public/data/goalie_season_lines.json \
              pipeline/goalie_vs_opp_cache.json data/archive/playoff_series_*.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          # Runs that only refreshed timestamps don't earn a commit (and a
          # Vercel build), except as a heartbeat every 6 h so the freshness
          # check and the site's "updated" stamp stay truthful.
          if git diff --cached --quiet -- . ':(exclude)public/data/manifest.json' \
               ':(exclude)public/data/last_updated.json' ':(exclude)data/last_updated.json'; then
            age=$(git show HEAD:public/data/manifest.json 2>/dev/null | python -c "
          import json, sys, datetime as d
          try:
              g = json.load(sys.stdin)['generated_at'].replace('Z', '+00:00')
              print(int((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(g)).total_seconds()))
          except Exception:
              print(10**9)")
            if [ "${age:-1000000000}" -lt 21600 ]; then
              echo "Only timestamps changed and the last heartbeat is < 6h old — not committing."
              git reset -q
              exit 0
            fi
            echo "Timestamp-only heartbeat commit."
          fi

          git commit -q -m "Auto-Update: Data Refresh [$(date -u +%Y-%m-%dT%H:%M:%SZ)] (${{ steps.mode.outputs.mode }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # odds_close.yml also pushes to main (disjoint files), so retry a rejected push.
          for attempt in 1 2 3 4; do
            git -c "http.https://github.com/.extraheader=$auth" pull --rebase --autostash origin main
            if git -c "http.https://github.com/.extraheader=$auth" push origin HEAD:main; then break; fi
            [ "$attempt" = 4 ] && { echo "::error::push failed after 4 attempts"; exit 1; }
            sleep $((attempt * 5))
          done
          # Vercel's git integration deploys the push; vercel.json's ignoreCommand
          # skips builds for commits that touch only pipeline-internal state.

      - name: Sync predictions to Supabase
        if: vars.SUPABASE_SYNC == '1' && steps.mode.outputs.mode == 'full'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          python scripts/snapshot_predictions.py
          python scripts/sync_history_to_supabase.py

      - name: Working tree after run
        if: always()
        run: git status --porcelain | head -40

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          title="Data pipeline failing"
          summary=$(python - <<'PY'
          import json
          try:
              m = json.load(open("public/data/manifest.json"))
          except Exception as e:
              print(f"(no manifest: {e})"); raise SystemExit
          bad = [s for s in m.get("stages", []) if s.get("status") == "fail"]
          print(f"season {m.get('season_id')} · mode {m.get('mode')} · generated {m.get('generated_at')}")
          for s in bad:
              print(f"- `{s['stage']}`{' (required)' if s.get('required') else ''}: {s.get('error') or s.get('reason') or 'failed'}")
          for k, v in (m.get("stale") or {}).items():
              print(f"- stale `{k}`: {v}")
          PY
          )
          body=$(printf 'Run %s (%s mode) failed.\n\n%s\n' "$RUN_URL" "${MODE:-?}" "$summary")
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                  --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close the failure issue after a clean run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Data pipeline failing"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                  --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Recovered in $RUN_URL"
          fi
