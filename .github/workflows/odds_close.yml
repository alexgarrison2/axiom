name: Odds close snapshots

# Forward archive of pregame prices, starting goalies, lineups and injuries
# (DESIGN §2.4, docs/SNAPSHOTS.md).  Each run appends one row per selected game
# to pipeline/snapshots/<season>/<date>.jsonl.gz, commits it to main and copies
# the day file to the "snapshots-<season>" release.  Nothing here can be
# re-fetched later, so the job is cheap, tolerant of source failures and
# triggered three ways:
#   * the Cloudflare Worker in infra/cloudflare-snapshot-worker dispatches it
#     8-13 min before each start time (the reliable path, D6);
#   * these crons are the fallback: :17 and :47 catch the usual :30 / :00
#     start slots 13 min out (GitHub cron can fire late or not at all);
#   * one morning slate sweep (15:07 UTC, all of today's games) gives the
#     earliest game-day price q0 for the line-movement test.
# Set the repository variable SNAPSHOT_CRON=off once the Worker is live to
# stop the close crons (skipped jobs bill no minutes); the morning sweep keeps
# running either way.

on:
  schedule:
    - cron: '7 15 * * *'             # slate sweep (window 24 h)
    - cron: '17,47 15-23 * * *'      # close fallback, 15:17-23:47 UTC
    - cron: '17,47 0-3 * * *'        # close fallback, 00:17-03:47 UTC
  workflow_dispatch:
    inputs:
      window:
        description: 'Capture games starting within this many minutes (25 = close, 1440 = whole slate)'
        default: '25'
      games:
        description: 'Optional comma-separated NHL game ids to capture regardless of the window'
        default: ''
      trigger:
        description: 'Who asked (worker, manual, ...); recorded on every row'
        default: 'manual'

# Snapshot runs never overlap (they append to the same day file).  A running
# capture is never cancelled; note that GitHub keeps at most ONE pending run
# per group, so a third trigger arriving while one runs and one waits replaces
# the waiting one (both would capture the same games).  Deliberately NOT the
# update-nhl-data group: a queued close capture must not wait behind a
# 30-minute full refresh.  The two workflows write disjoint files.
#
# A queued run checks out the commit that was main when it was TRIGGERED, which
# can be older than the previous snapshot run's push.  So the capture writes to
# a staging file and the push loop re-applies it on top of the latest main on
# every attempt (append-only + content dedupe make that idempotent): no binary
# rebase conflict on the .jsonl.gz day file can ever drop a run's rows.
concurrency:
  group: odds-close-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == '7 15 * * *' ||
      vars.SNAPSHOT_CRON != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the snapshot commit and upload the release asset
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the token is handed only to the push step

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # No dependency install: the snapshot job uses the standard library only.

      - name: Capture snapshots
        id: capture
        working-directory: pipeline
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_WINDOW: ${{ inputs.window }}
          IN_GAMES: ${{ inputs.games }}
          IN_TRIGGER: ${{ inputs.trigger }}
        run: |
          window=25; trigger="cron-close"; games=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            window="${IN_WINDOW:-25}"; trigger="${IN_TRIGGER:-manual}"; games="$IN_GAMES"
          elif [ "$SCHEDULE" = "7 15 * * *" ]; then
            window=1440; trigger="cron-slate"
          fi
          case "$window" in ''|*[!0-9.]*) echo "bad window '$window'"; exit 1 ;; esac
          case "$games" in *[!0-9,\ ]*) echo "bad games '$games'"; exit 1 ;; esac
          trigger=$(printf '%s' "$trigger" | tr -cd 'A-Za-z0-9_.-' | cut -c1-32)
          python -m bu.snapshots --window "$window" --games "$games" --trigger "$trigger" \
            --stage "${RUNNER_TEMP:-/tmp}/snapshot_rows.jsonl"

      - name: Commit and push snapshots
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stage="${RUNNER_TEMP:-/tmp}/snapshot_rows.jsonl"
          files="${RUNNER_TEMP:-/tmp}/snapshot_files.txt"
          if [ ! -s "$stage" ]; then
            echo "No snapshot rows captured."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          for i in 1 2 3 4 5; do
            # Start every attempt from the latest main and re-apply the staged
            # rows (idempotent), so a concurrent push can never conflict.
            if git -c "http.https://github.com/.extraheader=$auth" fetch -q --depth=1 origin main &&
               git reset -q --hard FETCH_HEAD &&
               (cd pipeline && python -m bu.snapshots append --stage "$stage" --out snapshots); then
              git add -A -- pipeline/snapshots
              if git diff --cached --quiet; then
                echo "No new snapshot rows (already stored)."
                exit 0
              fi
              git diff --cached --name-only > "$files"
              git commit -q -m "Snapshots: odds/lineups [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
              if git -c "http.https://github.com/.extraheader=$auth" push -q origin HEAD:main; then
                echo "pushed=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 4))
          done
          echo "could not push snapshots after 5 attempts"
          exit 1

      - name: Copy day files to the season release
        if: steps.push.outputs.pushed == '1'
        continue-on-error: true   # git already holds the data; the release is the second copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r f; do
            [ -f "$f" ] || continue
            season=$(basename "$(dirname "$f")")
            tag="snapshots-$season"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main --latest=false \
                --title "Pregame snapshots $season" \
                --notes "Append-only pregame odds/lineup snapshots (one .jsonl.gz per game date). See docs/SNAPSHOTS.md."
            fi
            gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done < "${RUNNER_TEMP:-/tmp}/snapshot_files.txt"
