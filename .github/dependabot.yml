version: 2
updates:
  # Frontend (Next.js, React, tooling). Security updates are opened immediately
  # regardless of this schedule; version bumps are batched into one PR a month.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Python data pipeline (requirements.txt at the repo root).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: "deps(py)"

  # Workflows pin actions to commit SHAs; Dependabot keeps the SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
